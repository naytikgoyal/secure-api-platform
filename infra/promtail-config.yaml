server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Ships stdout logs from every container tagged with our services --
  # since gateway/auth-server/resource-service all emit structured JSON
  # (pino / structlog, Week 7), Loki can index and query fields directly
  # (e.g. `{service="gateway"} | json | level="warn"`), not just full-text
  # search a blob of unstructured text.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
