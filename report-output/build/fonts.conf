<?xml version="1.0"?>
<fontconfig>
  <!-- lets the bundled LibreOffice find the macOS system fonts, so the PDF embeds Times New Roman as the template requires -->
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <cachedir>/tmp/fc-cache-report</cachedir>
</fontconfig>
