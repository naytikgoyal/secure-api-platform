<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#222"/></marker><marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#b3261e"/></marker><marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f7d3a"/></marker></defs><rect x="10" y="56" width="320" height="40" rx="8" fill="#e3eefb" stroke="#2a5d9f" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="170.0" y="76.0">orders  (PostgreSQL)</tspan></text><rect x="10" y="96" width="320" height="200" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.2"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="24" y="124.0">id</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="120" y="124.0">UUID  PRIMARY KEY</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="24" y="160.0">item</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="120" y="160.0">TEXT  NOT NULL</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="24" y="196.0">quantity</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="120" y="196.0">INTEGER  NOT NULL</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="24" y="232.0">owner_id</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="120" y="232.0">TEXT  NOT NULL  (indexed)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="24" y="268.0">created_at</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="120" y="268.0">TIMESTAMPTZ  NOT NULL</tspan></text><rect x="10" y="316" width="320" height="74" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="170.0" y="337.1">Application role orders_app owns this</tspan><tspan x="170.0" y="353.0">database only: no superuser, no CREATEDB,</tspan><tspan x="170.0" y="368.9">no CREATEROLE, no other database</tspan></text><rect x="10" y="410" width="320" height="56" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="170.0" y="430.1">Pydantic: item 1-200 characters,</tspan><tspan x="170.0" y="445.9">quantity 1-1000, owner_id 1-100</tspan></text><rect x="420" y="56" width="390" height="58" rx="8" fill="#eeeeee" stroke="#555555" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="615.0" y="76.3">Users  (Auth Server memory)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#333333"><tspan x="615.0" y="95.9">sub, username, passwordHash (bcrypt, cost 10), scopes[]</tspan></text><rect x="420" y="124" width="390" height="58" rx="8" fill="#eeeeee" stroke="#555555" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="615.0" y="144.3">Refresh tokens  (Auth Server memory)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#333333"><tspan x="615.0" y="163.9">48-byte hex token  -&gt;  sub, scopes, expiresAt (7 days)</tspan></text><rect x="420" y="192" width="390" height="58" rx="8" fill="#eeeeee" stroke="#555555" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="615.0" y="212.3">Failed attempts  (Auth Server memory)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#333333"><tspan x="615.0" y="231.9">(username, address)  -&gt;  count, lockedUntil (15 min)</tspan></text><rect x="420" y="260" width="390" height="58" rx="8" fill="#e3eefb" stroke="#2a5d9f" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="615.0" y="280.3">Nonces  (Redis)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#333333"><tspan x="615.0" y="299.9">nonce:&lt;32 hex&gt;  -&gt;  "1", expires after 300 s</tspan></text><rect x="420" y="328" width="390" height="58" rx="8" fill="#e3eefb" stroke="#2a5d9f" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="615.0" y="348.3">Rate-limit counters  (Redis)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#333333"><tspan x="615.0" y="367.9">keyed by user (Gateway) or IP (Auth Server)</tspan></text><rect x="420" y="396" width="390" height="58" rx="8" fill="#efe6f8" stroke="#6a3d9a" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="615.0" y="416.3">Secrets  (Vault KV v2)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#333333"><tspan x="615.0" y="435.9">jwt-signing, hmac-signing, db-creds</tspan></text><path d="M420,85 L375,85 L375,232 L330,232" fill="none" stroke="#222" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#ah)"/><text font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="375" y="247.5">sub = owner_id</tspan><tspan x="375" y="262.0">(logical link,</tspan><tspan x="375" y="276.5">no foreign key)</tspan></text></svg>