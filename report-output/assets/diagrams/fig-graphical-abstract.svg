<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#222"/></marker><marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#b3261e"/></marker><marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f7d3a"/></marker></defs><text font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="410" y="24.0">Every API request is checked at four independent layers</tspan></text><rect x="8" y="150" width="100" height="90" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="58.0" y="185.1">Client</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#333333"><tspan x="58.0" y="207.5">HTTPS</tspan></text><rect x="140" y="90" width="150" height="200" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="215" y="114.0">1  API Gateway</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="215" y="166.0">TLS 1.2+</tspan><tspan x="215" y="192.0">JWT, RS256 only</tspan><tspan x="215" y="218.0">scope check</tspan><tspan x="215" y="244.0">rate limit</tspan></text><rect x="310" y="90" width="150" height="200" rx="8" fill="#fde8d3" stroke="#c25e00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="385" y="114.0">2  Service link</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="385" y="166.0">mutual TLS</tspan><tspan x="385" y="192.0">HMAC-SHA256</tspan><tspan x="385" y="218.0">nonce, 60 s window</tspan><tspan x="385" y="244.0">generic 401</tspan></text><rect x="480" y="90" width="150" height="200" rx="8" fill="#e2f3e4" stroke="#2f7d3a" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="555" y="114.0">3  Resource Service</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="555" y="166.0">JWT verified again</tspan><tspan x="555" y="192.0">scope again</tspan><tspan x="555" y="218.0">owner must match</tspan><tspan x="555" y="244.0">input validation</tspan></text><rect x="650" y="90" width="150" height="200" rx="8" fill="#e3eefb" stroke="#2a5d9f" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="725" y="114.0">4  Database</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="725" y="166.0">parameterised SQL</tspan><tspan x="725" y="192.0">least-privilege role</tspan><tspan x="725" y="218.0">port not published</tspan><tspan x="725" y="244.0">secrets from Vault</tspan></text><path d="M108,195 L140,195" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><path d="M290,195 L310,195" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><path d="M460,195 L480,195" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><path d="M630,195 L650,195" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="140" y="325" width="200" height="44" rx="8" fill="#efe6f8" stroke="#6a3d9a" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="240.0" y="347.0">Vault: secrets</tspan></text><rect x="360" y="325" width="200" height="44" rx="8" fill="#e3eefb" stroke="#2a5d9f" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="460.0" y="347.0">Redis: limits, nonces</tspan></text><rect x="580" y="325" width="220" height="44" rx="8" fill="#eeeeee" stroke="#555555" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="690.0" y="347.0">Loki + Grafana: audit logs</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="8" y="339.1">Supporting</tspan><tspan x="8" y="354.9">services</tspan></text><rect x="8" y="392" width="804" height="36" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="410.0" y="410.0">Validated by an attacker toolkit (28 checks), 19 live flows and 26 unit tests</tspan></text></svg>