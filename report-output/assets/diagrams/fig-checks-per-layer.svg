<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#222"/></marker><marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#b3261e"/></marker><marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f7d3a"/></marker></defs><rect x="8" y="10" width="196" height="40" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="106.0" y="30.0">1  API Gateway</tspan></text><rect x="8" y="56" width="196" height="330" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.2"/><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="20" y="80.0">HTTPS only, TLS 1.2+</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="20" y="120.0">helmet security headers</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="20" y="160.0">JSON body limit 100 kB</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="20" y="200.0">Bearer JWT, RS256 only</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="20" y="240.0">issuer, audience, expiry</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="20" y="280.0">scope check per route</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="20" y="320.0">100 requests/min per user</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="20" y="360.0">?owner_id needs admin</tspan></text><rect x="212" y="10" width="196" height="40" rx="8" fill="#fde8d3" stroke="#c25e00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="310.0" y="30.0">2  Service link</tspan></text><rect x="212" y="56" width="196" height="330" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.2"/><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="224" y="80.0">client certificate (mTLS)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="224" y="120.0">CA pinned by the Gateway</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="224" y="160.0">HMAC-SHA256 over method</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="224" y="200.0">target, body, time, nonce</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="224" y="240.0">60 s timestamp window</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="224" y="280.0">nonce kept for 300 s</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="224" y="320.0">constant-time comparison</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="224" y="360.0">generic 401 on any failure</tspan></text><rect x="416" y="10" width="196" height="40" rx="8" fill="#e2f3e4" stroke="#2f7d3a" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="514.0" y="30.0">3  Resource Service</tspan></text><rect x="416" y="56" width="196" height="330" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.2"/><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="428" y="80.0">JWT verified again</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="428" y="120.0">scope checked again</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="428" y="160.0">owner_id must equal sub</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="428" y="200.0">order ownership (BOLA)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="428" y="240.0">admin scope for others</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="428" y="280.0">Pydantic type and size rules</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="428" y="320.0">null bytes rejected</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="428" y="360.0">errors reveal no detail</tspan></text><rect x="620" y="10" width="196" height="40" rx="8" fill="#e3eefb" stroke="#2a5d9f" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="718.0" y="30.0">4  Data layer</tspan></text><rect x="620" y="56" width="196" height="330" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.2"/><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="632" y="80.0">%s placeholders only</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="632" y="120.0">UUID shape checked first</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="632" y="160.0">role orders_app</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="632" y="200.0">no superuser, CREATEDB</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="632" y="240.0">other databases closed</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="632" y="280.0">database port not published</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="632" y="320.0">credentials come from Vault</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="632" y="360.0">one table, one index</tspan></text><rect x="8" y="400" width="804" height="56" rx="8" fill="#eeeeee" stroke="#555555" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="410.0" y="419.5">Across all layers: Vault secrets  |  Auth Server limit 10 logins/min  |  lockout after 5 failures per source</tspan><tspan x="410.0" y="436.5">bcrypt password hashes  |  structured JSON audit log with request IDs</tspan></text></svg>