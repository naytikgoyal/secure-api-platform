<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 0 820 580"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#222"/></marker><marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#b3261e"/></marker><marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f7d3a"/></marker></defs><rect x="8" y="8" width="258" height="38" rx="8" fill="#eeeeee" stroke="#555555" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="137.0" y="27.0">A.  Perimeter trust</tspan></text><rect x="22" y="70" width="230" height="56" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="137.0" y="98.0">Client</tspan></text><path d="M137,126 L137,148" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="22" y="148" width="230" height="56" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="137.0" y="168.1">Gateway:</tspan><tspan x="137.0" y="183.9">TLS + JWT check</tspan></text><path d="M137,204 L137,226" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="22" y="226" width="230" height="56" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="137.0" y="246.1">Internal services</tspan><tspan x="137.0" y="261.9">(trust the Gateway)</tspan></text><path d="M137,282 L137,304" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="22" y="304" width="230" height="56" rx="8" fill="#e3eefb" stroke="#2a5d9f" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="137.0" y="324.1">Database</tspan><tspan x="137.0" y="339.9">(one shared account)</tspan></text><rect x="8" y="400" width="258" height="170" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.2"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="18" y="420.0">+ simple, fast</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="18" y="458.0">- one check only</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="18" y="496.0">- a Gateway flaw exposes everything</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="18" y="532.0">- no protection against replay</tspan><tspan x="18" y="548.0">  on the internal hop</tspan></text><rect x="281" y="8" width="258" height="38" rx="8" fill="#eeeeee" stroke="#555555" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="410.0" y="27.0">B.  Monolith with sessions</tspan></text><rect x="295" y="70" width="230" height="56" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="410.0" y="90.1">Client</tspan><tspan x="410.0" y="105.9">(session cookie)</tspan></text><path d="M410,126 L410,148" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="295" y="148" width="230" height="56" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="410.0" y="168.1">One application:</tspan><tspan x="410.0" y="183.9">session store + roles</tspan></text><path d="M410,204 L410,226" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="295" y="226" width="230" height="56" rx="8" fill="#e3eefb" stroke="#2a5d9f" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="410.0" y="254.0">Database</tspan></text><rect x="281" y="400" width="258" height="170" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.2"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="291" y="420.0">+ least moving parts</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="291" y="458.0">- session lives in one process</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="291" y="496.0">- no service isolation</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="291" y="534.0">- every defect is in one blast radius</tspan></text><rect x="554" y="8" width="258" height="38" rx="8" fill="#e2f3e4" stroke="#2f7d3a" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="683.0" y="27.0">C.  Layered zero trust (built)</tspan></text><rect x="568" y="70" width="230" height="56" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="683.0" y="98.0">Client</tspan></text><path d="M683,126 L683,148" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="568" y="148" width="230" height="56" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="683.0" y="168.1">Gateway: JWT, scope,</tspan><tspan x="683.0" y="183.9">rate limit</tspan></text><path d="M683,204 L683,226" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="568" y="226" width="230" height="56" rx="8" fill="#e2f3e4" stroke="#2f7d3a" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="683.0" y="246.1">Resource Service: mTLS,</tspan><tspan x="683.0" y="261.9">HMAC, nonce, JWT again</tspan></text><path d="M683,282 L683,304" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="568" y="304" width="230" height="56" rx="8" fill="#e3eefb" stroke="#2a5d9f" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="683.0" y="324.1">Database: parameterised,</tspan><tspan x="683.0" y="339.9">least privilege</tspan></text><rect x="554" y="400" width="258" height="170" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.2"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="564" y="420.0">+ independent checks per layer</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="564" y="458.0">+ replay and tampering blocked</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="564" y="496.0">- more components to run</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="564" y="534.0">- more latency and set-up work</tspan></text></svg>