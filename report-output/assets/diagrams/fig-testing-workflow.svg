etica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="247" y="112.0">Live functional flows</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="247" y="181.0">curl, psql</tspan><tspan x="247" y="202.0">19 flows</tspan><tspan x="247" y="223.0">login to SQL</tspan></text><path d="M322,190 L336,190" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="336" y="90" width="150" height="200" rx="8" fill="#fbe3e3" stroke="#b3261e" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="411" y="112.0">Attacker toolkit</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="411" y="160.0">5 scripts</tspan><tspan x="411" y="181.0">28 checks</tspan><tspan x="411" y="202.0">replay, forgery,</tspan><tspan x="411" y="223.0">brute force, SQLi,</tspan><tspan x="411" y="244.0">TLS downgrade</tspan></text><path d="M486,190 L500,190" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="500" y="90" width="150" height="200" rx="8" fill="#fde8d3" stroke="#c25e00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="575" y="112.0">Independent probes</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="575" y="170.5">TLS version probe</tspan><tspan x="575" y="191.5">login timing</tspan><tspan x="575" y="212.5">rate-limit burst</tspan><tspan x="575" y="233.5">Loki queries</tspan></text><path d="M650,190 L664,190" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="664" y="90" width="150" height="200" rx="8" fill="#e2f3e4" stroke="#2f7d3a" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="739" y="112.0">Browser checks</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="739" y="170.5">Playwright</tspan><tspan x="739" y="191.5">login, dashboard,</tspan><tspan x="739" y="212.5">XSS strings,</tspan><tspan x="739" y="233.5">Grafana</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="410" y="318.0">Every figure and result in Chapter 4 comes from one of these five stages</tspan></text></svg>