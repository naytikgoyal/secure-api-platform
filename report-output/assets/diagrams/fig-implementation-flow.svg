t (HMAC, timestamp, nonce) and call over mTLS</tspan></text><path d="M620,367 L660,367" fill="none" stroke="#b3261e" stroke-width="1.8" marker-end="url(#ahr)"/><rect x="660" y="347" width="150" height="40" rx="8" fill="#fbe3e3" stroke="#b3261e" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="735.0" y="367.0">502 if upstream fails</tspan></text><path d="M385,394 L385,406" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="150" y="406" width="470" height="54" rx="8" fill="#e2f3e4" stroke="#2f7d3a" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="385.0" y="433.0">Client certificate valid for the mTLS handshake?</tspan></text><path d="M620,433 L660,433" fill="none" stroke="#b3261e" stroke-width="1.8" marker-end="url(#ahr)"/><rect x="660" y="413" width="150" height="40" rx="8" fill="#fbe3e3" stroke="#b3261e" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="735.0" y="433.0">handshake fails</tspan></text><path d="M385,460 L385,472" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="150" y="472" width="470" height="54" rx="8" fill="#e2f3e4" stroke="#2f7d3a" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="385.0" y="499.0">HMAC signature and 60-second window correct?</tspan></text><path d="M620,499 L660,499" fill="none" stroke="#b3261e" stroke-width="1.8" marker-end="url(#ahr)"/><rect x="660" y="479" width="150" height="40" rx="8" fill="#fbe3e3" 