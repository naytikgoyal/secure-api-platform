<svg xmlns="http://www.w3.org/2000/svg" width="820" height="650" viewBox="0 0 820 650"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#222"/></marker><marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#b3261e"/></marker><marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2f7d3a"/></marker></defs><text font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="140" y="22.0">API Gateway: sign</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="520" y="22.0">Resource Service: verify</tspan></text><rect x="20" y="50" width="240" height="140" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="140.0" y="70.0">Build canonical string</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="140.0" y="95.0">METHOD</tspan><tspan x="140.0" y="114.0">PATH?QUERY</tspan><tspan x="140.0" y="133.0">BODY</tspan><tspan x="140.0" y="152.0">TIMESTAMP</tspan><tspan x="140.0" y="171.0">NONCE (128-bit random)</tspan></text><rect x="20" y="225" width="240" height="70" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="140.0" y="250.8">HMAC-SHA256 with the</tspan><tspan x="140.0" y="269.1">shared secret from Vault</tspan></text><rect x="20" y="330" width="240" height="90" rx="8" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="140.0" y="350.0">Send three headers</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="140.0" y="378.5">X-Signature   X-Timestamp</tspan><tspan x="140.0" y="397.5">X-Nonce</tspan></text><path d="M140,190 L140,225" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><path d="M140,295 L140,330" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><polygon points="470,32.0 585.0,70 470,108.0 355.0,70" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="470" y="61.5">Three headers</tspan><tspan x="470" y="78.5">present?</tspan></text><polygon points="470,130.0 585.0,168 470,206.0 355.0,168" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="470" y="159.5">Timestamp within</tspan><tspan x="470" y="176.5">60 s of now?</tspan></text><polygon points="470,292.0 585.0,330 470,368.0 355.0,330" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="470" y="321.5">Signature equal?</tspan><tspan x="470" y="338.5">(constant time)</tspan></text><polygon points="470,402.0 585.0,440 470,478.0 355.0,440" fill="#fff4cf" stroke="#a67c00" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="470" y="431.5">Nonce unused?</tspan><tspan x="470" y="448.5">(SET NX EX 300)</tspan></text><rect x="355" y="232" width="230" height="52" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#111111"><tspan x="470.0" y="250.1">Rebuild the string from the raw</tspan><tspan x="470.0" y="265.9">path, query and body</tspan></text><rect x="355" y="540" width="230" height="56" rx="8" fill="#e2f3e4" stroke="#2f7d3a" stroke-width="1.6"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" font-style="normal" fill="#111111"><tspan x="470.0" y="559.5">Continue: JWT, scope,</tspan><tspan x="470.0" y="576.5">ownership, SQL</tspan></text><path d="M470,108 L470,132" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><path d="M470,206 L470,232" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><path d="M470,284 L470,292" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><path d="M470,368 L470,402" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><path d="M470,478 L470,540" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><path d="M260,375 L300,375 L300,70 L355,70" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/><path d="M585,70 L640,70" fill="none" stroke="#222" stroke-width="1.8"/><path d="M585,168 L640,168" fi