 token, issue new pair (rotation)</tspan></text><path d="M410.0,511.8 L120.0,511.8" fill="none" stroke="#222" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#ah)"/><rect x="132.6" y="489.9" width="264.9" height="17.9" fill="#ffffff" fill-opacity="0.92"/><text font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="400" font-style="normal" fill="#222"><tspan x="265.0" y="498.8">200 new tokens  |  401 if token reused</tspan></text></svg>